# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

# Destroy Pipeline - Manual Trigger Only
trigger: none  # Manual trigger to prevent accidental deletion

pool:
  name: Default

# Define backend variables in pipeline
variables:
  TF_STATE_ACCOUNT: testaccountsampltf
  TF_STATE_CONTAINER: sampletfcontainer
  TF_STATE_KEY: terraform.tfstate
  TF_STATE_RG: test-rg

steps:
- checkout: self

# Step 1: Verify Terraform version
- script: |
    terraform version
  displayName: "Verify Terraform"

# Step 2: Initialize Terraform backend
- script: |
    cd $(Build.SourcesDirectory)/templetes
    terraform init \
      -backend-config="storage_account_name=$(TF_STATE_ACCOUNT)" \
      -backend-config="container_name=$(TF_STATE_CONTAINER)" \
      -backend-config="key=$(TF_STATE_KEY)" \
      -backend-config="resource_group_name=$(TF_STATE_RG)"
  displayName: "Terraform Init"

# Step 3: Destroy all resources
- script: |
    cd $(Build.SourcesDirectory)/templetes
    terraform destroy -var-file=terraform.tfvars -auto-approve
  displayName: "Terraform Destroy"




