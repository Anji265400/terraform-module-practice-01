# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - main

pool:
 name: Default    #self hosted vm name

variables:
  terraformDir: '$(System.DefaultWorkingDirectory)/templetes'
  workspace: QA

steps:
- script: |
    terraform version
  displayName: "Check Terraform Version"


- task: TerraformTaskV4@4
  displayName: "Terraform init"
  inputs:
    provider: 'azurerm'
    command: 'init'
    workingDirectory: '$(terraformDir)'
    backendServiceArm: 'new_sv_connection'
    backendAzureRmResourceGroupName: 'test-rg'
    backendAzureRmStorageAccountName: 'testaccountsampltf'
    backendAzureRmContainerName: 'sampletfcontainer'
    backendAzureRmKey: 'terraform.tfstate'

- script: |
    terraform workspace select $(workspace) || terraform workspace new $(workspace)
  workingDirectory: '$(terraformDir)'
  displayName: 'Terraform Workspace'


- task: TerraformTask@5
  displayName: "Terraform Destroy"
  inputs:
    provider: 'azurerm'
    command: 'destroy'
    workingDirectory: '$(terraformDir)'
    commandOptions: '--auto-approve'
    environmentServiceNameAzureRM: 'new_sv_connection'

