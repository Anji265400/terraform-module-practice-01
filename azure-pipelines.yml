# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  name: Default

steps:

- checkout: self

# Step 2: Install Terraform
- task: TerraformInstaller@1
  displayName: 'Install Terraform 1.14.3'
  inputs:
    terraformVersion: '1.14.3'

# Terraform Init
- task: TerraformTask@5
  displayName: 'Terraform Init'
  inputs:
    provider: 'azurerm'
    command: 'init'
    terraformVersion: '1.14.3'
    workingDirectory: 'terraform-module-practice-01/templetes' 
    backendServiceArm: 'new_sv_connection'
    backendAzureRmResourceGroupName: 'test-rg'
    backendAzureRmStorageAccountName: 'testaccountsampltf'
    backendAzureRmContainerName: 'sampletfcontainer'
    backendAzureRmKey: 'terraform.tfstate'

# Terraform Plan
- task: TerraformTask@5
  displayName: 'Terraform Plan'
  inputs:
    provider: 'azurerm'
    command: 'plan'
    terraformVersion: '1.14.3'
    workingDirectory: 'terraform-module-practice-01/templetes' 
    environmentServiceNameAzureRM: 'new_sv_connection'

# Terraform Apply
- task: TerraformTask@5
  displayName: 'Terraform Apply'
  inputs:
    provider: 'azurerm'
    command: 'apply'
    terraformVersion: '1.14.3'
    workingDirectory: 'terraform-module-practice-01/templetes'
    environmentServiceNameAzureRM: 'new_sv_connection'
    commandOptions: '--auto-approve'






